<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/components/css/header.css">
	<link rel="stylesheet" href="/components/css/footer.css">
	<link rel="stylesheet" href="/static/css/create-tournament/level1.css">
	<link rel="stylesheet" href="/static/css/create-tournament/level2.css">
	<link rel="stylesheet" href="/static/css/create-tournament/level3.css">
	<title>Criação de campeonato</title>
</head>

<body>

	<div id="header"></div>

	<main>
		<div class="create-tournament-card">
			<div class="process-counter">
				<span class="process-visualize" id="process-counter-one"></span>
				<span class="process-visualize" id="process-counter-two"></span>
				<span class="process-visualize" id="process-counter-three"> </span>
			</div>

			<div class="levels">
				<div class="create-process level-one">
					<div class="create-process-title">
						<h1>Dados básicos do campeonato</h1>
					</div>

					<form class="tournament-set-form">
						<div class="tournament-image-visualization">
							<img src="" alt="Imagem selecionada">
						</div>

						<div class="tournament-set-title">
							<input class="getData1" type="text" placeholder="Título">
						</div>
						<div class="tournament-set-description">
							<textarea class="getData1" placeholder="Descrição"></textarea>
						</div>

						<div class="tournament-set-teams">
							<div class="teams-quantity">
								<label>Quantidade de times</label>

								<!-- 'n' times -->
								<div class="fixed-teams-quantity">
									<input class="getData1" type="number" placeholder="">
								</div>

								<!-- De 'x' até 'y' -->
								<div class="dynamic-teams-quantity" style="display: none">
									<input class="getData1" type="number" placeholder="De">
									<input class="getData1" type="number" placeholder="Até">
								</div>
							</div>

							<div class="teams-quantity-set-type">
								<div>
									<input id="quantity-type-fixed" type="radio" name="quantity-type" checked onclick="chooseTeamQuantityStyle('fixed')">
									<span>Valor fixo</span>
								</div>
								<div>
									<input id="quantity-type-dynamic" type="radio" name="quantity-type" value="" onclick="chooseTeamQuantityStyle('dynamic')">
									<span>Dinâmico</span>
								</div>
							</div>
						</div>

						<div class="tournament-set-logo">
							<input class="getData1" type="file">
						</div>
					</form>
				</div>

				<div class="create-process level-two">
					<div class="create-process-title">
						<h1>Definição de formato(s)</h1>
					</div>

					<!-- FORMATO PRONTO -->
					<div class="created-formats">
						<div class="format format1">
							<h2>Formato 1</h2>

							<form class="format-form">
								<div class="formats-list">
									<label>Tipo de formato</label>
									<select>
										<option>Mata-mata</option>
										<option>Mata-mata com 2ª chance</option>
										<option>Fase de grupos/Pontos corridos</option>
										<option>Formato suiço</option>
										<!-- <option>Personalizado</option> -->
									</select>
								</div>

								<div class="best-of">
									<label>Melhor de (quantas partidas)</label>
									<input type="number" placeholder="Ex: 1">
								</div>
							</form>
						</div>

						<div class="format format2">
							<h2>Formato 2</h2>

							<form class="format-form">
								<div>
									<select>
										<option>Mata-mata</option>
										<option>Mata-mata com 2ª chance</option>
										<option>Fase de grupos/Pontos corridos</option>
										<option>Formato suiço</option>
										<!-- <option>Personalizado</option> -->
									</select>
								</div>

								<div class="best-of">
									<input type="number" placeholder="Ex: 1">
								</div>
							</form>
						</div>

						<div class="format format3">
							<h2>Formato 3</h2>

							<form class="format-form">
								<div>
									<select>
										<option>Mata-mata</option>
										<option>Mata-mata com 2ª chance</option>
										<option>Fase de grupos/Pontos corridos</option>
										<option>Formato suiço</option>
										<!-- <option>Personalizado</option> -->
									</select>
								</div>

								<div class="best-of">
									<input type="number" placeholder="Ex: 1">
								</div>
							</form>
						</div>

						<div class="control-formats">
							<span id="remove-format">Remover</span>
							<span id="add-format">Adicionar</span>
						</div>
					</div>
				</div>

				<div class="create-process level-three">
					<div class="create-process-title">
						<h1>Configurações adicionais</h1>
					</div>

					<form>
						<div class="set-online-mode">
							<span>Modo online:</span>
							<div>
								<input class="getData3" type="radio" name="online" checked value="0">
								<span>Sim</span>
							</div>
							<div>
								<input class="getData3" type="radio" name="online" value="1">
								<span>Não</span>
							</div>
						</div>

						<div class="set-modality">
							<label>Modalidade</label>
							<input class="getData3" type="text" placeholder="Ex: Games - CS 2">
						</div>
					</form>
				</div>
			</div>

			<div class="control-level">
				<button id="return-level">Retornar</button>
				<button id="advance-level">Avançar</button>
			</div>
		</div>
	</main>

	<div id="footer"></div>

	<script src="/static/js/api/auth.js"></script>
	<!-- <script src="/static/js/api/get-tournaments.js"></script> -->
	<script src="/static/js/api/create-tournament.js"></script>
	<script src="/components/js/header.js"></script>
	<script src="/components/js/footer.js"></script>
</body>

</html>
