<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/player-info.css">
    <title>Player - ${usermame}</title>
</head>
<body>
    
    <main>
        <div class="player-main-card">
            <div class="player-card">
               <!-- Edit com JS -->
            </div>

            <div class="player-profile-actions">
                <button onclick="openUserCreatedTeamsCard()">Enviar um convite para time (provisório)</button> 
                <!-- <button>Enviar um convite para campeonato</button>  -->

                <div class="user-created-teams">
                    <label>Seus times criados:</label>
                    
                    <!-- Edit com JS -->
                </div>
            </div>
        </div>
        
        <div class="player-external-info">
            <div class="player-teams">
                <h3>Times que participa</h3>

                <!-- Caso nao esteja em nenhum -->
                <span>O jogador não está em nenhum time</span>
            </div>

            <div class="player-tournaments">
                <h3>Campeonatos que está disputando</h3>

                <!-- Caso nao esteja em nenhum -->
                <span>O jogador não está participando de nenhum campeonato</span>
            </div>
        </div>
    </main>

    <script src="/static/js/api/auth.js"></script>
    <script src="/static/js/api/player-info.js"></script>
</body>
</html>
