<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/components/css/header.css">
    <link rel="stylesheet" href="/components/css/footer.css">
    <link rel="stylesheet" href="/static/css/invite/invites.css">
    <title>Convites - times</title>
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="invites-area">
            <h1>Convites</h1>

            <!-- MENU PRINCIPAL -->
            <div class="invite-type-menu-select">
                <span class="active">Geral</span>
                <span>Torneios</span>
                <span>Pesquisar</span>
            </div>

            <!-- GERAL -->
            <div class="general-invites m-active">
                <div class="invites-menu-select">
                    <span class="active" data-target="received-invitations">Recebidos (geral)</span>
                    <span data-target="sent-invitations">Enviados (geral)</span>
                </div>

                <div class="all-general-invites">
                    <div class="received-invitations active">
                        <!-- Conteúdo -->
                        <span id="not-found-received-invitations"></span>
                    </div>

                    <div class="sent-invitations">
                        <!-- Conteúdo -->
                        <span id="not-found-sent-invitations"></span>
                    </div>
                </div>
            </div>

            <!-- TOURNAMENT -->
            <div class="tournament-invites">
                <div class="tournament-invites-menu-select">
                    <span class="active" data-target="received-tournament-invitations">Recebidos (campeonatos)</span>
                    <span data-target="sent-tournament-invitations">Enviados (campeonatos)</span>
                </div>

                <div class="all-tournament-invites">
                    <div class="received-tournament-invitations active">
                        <!-- Conteúdo -->
                        <span id="not-found-received-tournament-invitations"></span>
                    </div>

                    <div class="sent-tournament-invitations">
                        <!-- Conteúdo -->
                        <span id="not-found-sent-tournament-invitations"></span>
                    </div>
                </div>
            </div>

            <!-- SEARCH ENTITY (player, team ou tournament) -->
            <div class="search-invites">
                <div class="search-invites-input-area">
                    <div class="search-invites-input-bar">
                        <input type="text">
                        <button>pesquisar</button>
                    </div>

                    <div class="search-invites-input-type">
                        <span class="search-active">Player</span>
                        <span>Time</span>
                        <span>Torneio</span>
                    </div>
                </div>

                <div class="search-invites-result">
                    <div class="search-invites-result-found">
                        <div class="search-invites-result-found-title">
                            <!-- add/remove com js -->
                        </div>
                        
                        <div class="search-invites-result-found-actions">
                            <!-- add/remove com js -->
                        </div>
                    </div>

                    <div class="search-invites-result-found">
                        <span>Nenhum dado encontrado</span>
                    </div>
                    
                </div>
            </div>

            <div class="tournament-invite-overlay" id="inviteOverlay">
                <div class="card-received-tournament-invite">
                    <div class="card-received-tournament-invite-title" data-field="title"></div>
                    <div class="card-received-tournament-invite-rel" data-field="rel"></div>
                    <div class="card-received-tournament-invite-description" data-field="description"></div>
                    <div class="card-received-tournament-invite-date" data-field="date"></div>
                    <div class="card-received-tournament-invite-actions" data-field="actions"></div>
                    <button class="close-card-btn">x</button>
                </div>

                <div class="card-sent-tournament-invite">
                    <div class="card-sent-tournament-invite-title" data-field="title"></div>
                    <div class="card-sent-tournament-invite-rel" data-field="rel"></div>
                    <div class="card-sent-tournament-invite-description" data-field="description"></div>
                    <div class="card-sent-tournament-invite-date" data-field="date"></div>
                    <div class="card-sent-tournament-invite-actions" data-field="actions"></div>
                    <button class="close-card-btn">x</button>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="/static/js/api/auth.js"></script>
    <script type="module" src="/static/js/api/invite.js"></script>
    <script src="/components/js/header.js"></script>
    <script src="/components/js/footer.js"></script>
</body>
</html>
