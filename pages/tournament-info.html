<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato - ${Campeonato}</title>
</head>
<body>
    
    <main>
        <div class="tournament-main-card">
            <!-- Edit com JS -->
        </div>

        <div class="tournament-external-info">
            <div class="tournament-running">
                <!-- Funcionamento do campeonato de fato (mostrar todas as fases do campeonatos e as partidas de forma mais visual, como o hltv) -->
            </div>

            <div class="tournament-matches">
                <h2>Partidas</h2>

                <!-- JS loop -->
                <div class="tournament-list-of-matches">
                    <div class="t-match">
                        <div class="t-match-basic-info">
                            <div class="t-match-status">
                                <span>${Pendente}</span>
                            </div>
                            <div class="t-match-datetime">
                                <span>Início</span>
                                <span>{$date}</span>
                                <span>{$time}</span>
                            </div>
                        </div>

                        <div class="t-match-teams">
                            <div class="t-match-team1">
                                <img src="#" alt="">
                                <span>${team title}</span>
                            </div>

                            <div class="t-match-result">
                                <div class="t-match-t1-result">
                                    <span>${}</span>
                                </div>

                                <span>x</span>

                                <div class="t-match-t1-result">
                                    <span>${}</span>
                                </div>
                            </div>

                            <div class="t-match-team1">
                                <img src="#" alt="">
                                <span>${team title}</span>
                            </div>

                            
                        </div>

                    </div>
                </div>
            </div>

            <div class="tournament-teams">
                <h2>Times participantes</h2>

                <!-- JS loop -->
                <div class="tournament-list-of-teams">
                    <div class="t-team">
                        <div class="t-team-image">
                            <img src="#" alt="">
                        </div>

                        <div class="t-team-data">
                            <h4>${Team name}</h4>
                        </div>

                        <div class="t-team-actions">
                            <a href="/pages/team-info.html"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>  
    </main>
    
    <script src="/static/js/api/auth.js"></script>
    <script src="/static/js/api/tournament-info.js"></script>
</body>
</html>
